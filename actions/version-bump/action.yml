name: "Version Bump"
description: "Cut a release from the release branch: merge base in, bump version + CHANGELOG, tag, and open a sync PR back to base"

inputs:
  version-type:
    description: "Version bump type (major, minor, patch, beta, alpha, rc)"
    required: true
  github-token:
    description: "GitHub token for creating/merging PRs"
    required: true
  base-branch:
    description: "Branch to target for the release PR"
    required: false
    default: "main"
  feature-tag:
    description: "Optional feature tag for pre-releases; e.g. `3ds` produces `3.135.0-beta-3ds.1`"
    required: false
  dry-run:
    description: "Simulate the version bump without making any changes"
    required: false
    default: "false"

outputs:
  new-version:
    description: "The new version number (without v prefix)"
    value: ${{ steps.bump.outputs.new_version }}

runs:
  using: "composite"
  steps:
    - uses: braintree/web-sdk-github-actions/actions/setup-git@cf4b40ff4b46c96aadbfae38806b8de404a98cb3

    - name: "Setup Node.js"
      uses: braintree/web-sdk-github-actions/actions/setup-node@cf4b40ff4b46c96aadbfae38806b8de404a98cb3
      with:
        cache: npm

    - name: "Check out release branch, merge base in"
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        # The callers check out shallow (depth 1), but merging base into an
        # existing release branch needs real history, so grab it all first.
        git fetch --prune --unshallow origin 2>/dev/null || git fetch --prune origin

        # First release on a repo may not have a release branch yet, so seed it
        # from base. After this, release is where the bump commit lands.
        if git show-ref --verify --quiet refs/remotes/origin/release; then
          git checkout -B release origin/release
        else
          git checkout -B release "origin/$BASE_BRANCH"
        fi

        git merge "origin/$BASE_BRANCH" --no-edit

    - name: "Validate CHANGELOG"
      run: node '${{ github.action_path }}/../../dist/validate-changelog.js'
      shell: bash

    - name: "Bump version and update CHANGELOG"
      id: bump
      run: node '${{ github.action_path }}/../../dist/bump-version.js'
      shell: bash
      env:
        VERSION_TYPE: ${{ inputs.version-type }}
        FEATURE_TAG: ${{ inputs.feature-tag }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        DRY_RUN: ${{ inputs.dry-run }}

    - name: "Push release, tag, and open sync-to-base PR"
      if: ${{ inputs.dry-run != 'true' }}
      run: node '${{ github.action_path }}/../../dist/release-pr.js'
      shell: bash
      env:
        NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
