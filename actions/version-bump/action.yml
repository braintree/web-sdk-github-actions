name: "Version Bump"
description: "Bump npm version, update CHANGELOG, create release branch + PR, merge, and tag"

inputs:
  version-type:
    description: "Version bump type (major, minor, patch, beta, alpha, rc)"
    required: true
  github-token:
    description: "GitHub token for creating/merging PRs"
    required: true
  base-branch:
    description: "Branch to target for the release PR"
    required: false
    default: "main"
  feature-tag:
    description: "Optional feature tag for pre-releases; e.g. `3ds` produces `3.135.0-beta-3ds.1`"
    required: false
  dry-run:
    description: "Simulate the version bump without making any changes"
    required: false
    default: "false"

outputs:
  new-version:
    description: "The new version number (without v prefix)"
    value: ${{ steps.bump.outputs.new_version }}

runs:
  using: "composite"
  steps:
    - uses: ${{ github.action_path }}/../setup-git

    - name: "Setup Node.js"
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: "Validate CHANGELOG"
      run: node '${{ github.action_path }}/../../dist/validate-changelog.js'
      shell: bash

    - name: "Bump version and update CHANGELOG"
      id: bump
      run: node '${{ github.action_path }}/../../dist/bump-version.js'
      shell: bash
      env:
        VERSION_TYPE: ${{ inputs.version-type }}
        FEATURE_TAG: ${{ inputs.feature-tag }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        DRY_RUN: ${{ inputs.dry-run }}

    - name: "Create release branch, PR, and tag"
      if: ${{ inputs.dry-run != 'true' }}
      run: node '${{ github.action_path }}/../../dist/release-pr.js'
      shell: bash
      env:
        NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
